name: Absent Reminder

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 09:00 UTC Mon–Fri (10am BST / 9am GMT)
  workflow_dispatch:           # allow manual trigger from GitHub Actions tab

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check for unaccounted absences and notify
        run: |
          curl -sf -X GET "https://your-domain.com/api/cron/absent-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
