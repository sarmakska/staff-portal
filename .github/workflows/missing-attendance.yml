name: Missing Attendance Report

on:
  schedule:
    - cron: '0 18 * * 1-5'   # 18:00 UTC Mon–Fri (7pm BST / 6pm GMT)
  workflow_dispatch:           # allow manual trigger from GitHub Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check for missing attendance records and notify
        run: |
          curl -sf -X GET "https://your-domain.com/api/cron/missing-attendance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
