name: Leave Accrual

on:
  schedule:
    - cron: '10 0 1 * *'   # 00:10 UTC on the first of every month
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  run-accrual:
    runs-on: ubuntu-latest
    steps:
      - name: Top up monthly leave accruals
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/leave-accrual" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
