name: IT Ticket Cleanup

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete resolved IT tickets older than 30 days
        run: |
          curl -sf -X GET "https://your-domain.com/api/cron/it-ticket-cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
