name: Stretch Reminder

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 10:00 UTC Mon–Fri (11am BST / 10am GMT)
    - cron: '0 14 * * 1-5'   # 14:00 UTC Mon–Fri (3pm BST / 2pm GMT)
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send stretch reminder to opted-in staff
        run: |
          curl -sf -X GET "https://your-domain.com/api/cron/stretch-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
