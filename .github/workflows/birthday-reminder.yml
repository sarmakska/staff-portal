name: Birthday Reminder

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC every day (9am UK summer, 8am UK winter)
  workflow_dispatch:       # allow manual trigger from GitHub Actions tab

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send birthday reminder emails
        run: |
          curl -sf -X GET "https://your-domain.com/api/cron/birthday-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
