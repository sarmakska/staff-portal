name: Diary Reminders

on:
  schedule:
    - cron: '0 7 * * *'   # 7am UTC every day (8am UK summer, 7am UK winter)
  workflow_dispatch:       # allow manual trigger from GitHub Actions tab

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send diary reminder emails
        run: |
          curl -sf -X GET "https://your-domain.com/api/cron/diary-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
